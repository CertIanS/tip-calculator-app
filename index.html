<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <link href="./styles.css" rel="stylesheet">
  <link href='https://fonts.googleapis.com/css?family=Space Mono' rel='stylesheet'>
  <script defer src="./main.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <!--<label for="bill">Bill</label>-->
      <p>Bill</p>
      <input id="bill" type="number" step="0.01" min="0" placeholder="0"/>
      <p>Select Tip %</p>
      <button id="five" onclick="calculateTip(this.id)">5%</button>
      <button id="ten" onclick="calculateTip(this.id)">10%</button>
      <button id="fifteen" onclick="calculateTip(this.id)">15%</button>
      <button id="twenty" onclick="calculateTip(this.id)">20%</button>
      <button id="twentyFive" onclick="calculateTip(this.id)">25%</button>
      <button disabled>Custom</button>
      <!--<label for="people">Number of People</label>-->
      <p>Number of People</p>
      <input id="people" type="number" min="0" placeholder="0"/>
      <div class="totals">
        <p>Tip Amount</p>
        <p>/ person</p>
        $<span id="tip">0.00</span>
        <p>Total</p>
        <p>/ person</p>
        $<span id="total">0.00</span>
        <button>Reset</button>
      </div>
    </div>
  </div>
  
</body>
</html>
