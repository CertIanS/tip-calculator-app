<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <link href="./styles.css" rel="stylesheet">
  <link href='https://fonts.googleapis.com/css?family=Space Mono' rel='stylesheet'>
  <script defer src="./main.js"></script>
</head>
<body>
  <img src="./images/logo.svg" alt="splitter"/>
  <div class="container">
    <div class="card">
      <form class="input">
        <label for="bill">Bill</label>
        <input id="bill" type="number" name="bill" step="0.01" min="0" placeholder="0"/>
        <p>Select Tip %</p>
        <input type="button" value="5%" id="five" onclick="calculateTip(this.id)"></input>
        <input type="button" value="10%" id="ten" onclick="calculateTip(this.id)"></input>
        <input type="button" value="15%" id="fifteen" onclick="calculateTip(this.id)"></input>
        <input type="button" value="25%" id="twentyFive" onclick="calculateTip(this.id)"></input>
        <input type="button" value="50%" id="fifty" onclick="calculateTip(this.id)"></input>
        <input type="text" id="custom" name="custom" placeholder="Custom"></input>
        <br><br>
        <label for="people">Number of People</label>
        <input id="people" type="number" name="people" min="0" placeholder="0"/>
      </form>
      
      <div class="totals">
        <!--<p id="tipTitle">Tip Amount</p>
        <p>/ person</p>
        <span>$<span id="tip">0.00</span></span>
        <p id="totalTitle">Total</p>
        <p>/ person</p>
        <span>$<span id="total">0.00</span></span><br>
        <button id="reset" onclick="reset()" disabled>Reset</button>-->
        <!--<div id="tip">
          <span><p id="tipTitle">Tip Amount</p>
          <p>/ person</p></span>
          <span>$<span id="tip">0.00</span></span>
        </div>
        <div id="total">
          <span><p id="totalTitle">Total</p>
          <p>/ person</p></span>
          <span>$<span id="total">0.00</span></span>
        </div>-->
        <div id="tipAmountTitle">
          <span><p id="tipTitle">Tip Amount</p>
          <p>/ person</p></span>
        </div>
        <div id="tipAmountNumber">
          <span>$<span id="tip">0.00</span></span>
        </div>
        <div id="totalAmountTitle">
          <span><p id="totalTitle">Total</p>
          <p>/ person</p></span>
        </div>
        <div id="totalAmountNumber">
          <span>$<span id="total">0.00</span></span>
        </div>
        <button id="reset" onclick="reset()" disabled>Reset</button>
      </div>
      
    </div>
  </div>
  
</body>
</html>
